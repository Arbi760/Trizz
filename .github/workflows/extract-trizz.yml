name: Extract TRIZZ Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract TRIZZ project
        run: |
          mkdir -p /tmp/trizz
          unzip -o TRIZZ_deployment_ready_final.zip -d /tmp/trizz

          rm -rf ./* ./.??* 2>/dev/null || true

          cp -a /tmp/trizz/. .

          rm -f TRIZZ_deployment_ready_final.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet || git commit -m "Extract TRIZZ deployment-ready project"
          git push
